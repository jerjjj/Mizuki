name: Deploy the website

on:
   push:
      branches: [ master ]

   repository_dispatch:
      types: 
         - content-updated 
   workflow_dispatch:

permissions:
  contents: write


jobs:
  deploy:
    runs-on: ubuntu-latest
    container:
      image: shangzheny/rth-host-helper:latest
    
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.GITHUB_TOKEN }}  
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "23"
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Setup deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x  

      - name: Build the website
        run: deno -A ./bundle-upload-fixed.cjs deploy
        env:
          ENABLE_CONTENT_SYNC: true
          CONTENT_REPO_URL: ${{ secrets.CONTENT_REPO_URL }}
          USE_SUBMODULE: true
          RTH_API_KEY: ${{ secrets.RTH_API_KEY }}
          BILI_SESSDATA: ${{ secrets.BILI_SESSDATA }}
